name: Scan & Deploy

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: scan-deploy
  cancel-in-progress: true

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run ArchMap
        uses: abdullahbodur/archmap@main
        with:
          github_token: ${{ secrets.ARCHMAP_TOKEN }}
          github_org: docktail
          output_path: _site

      - name: Commit updated graph.json
        run: |
          mkdir -p data
          cp _site/graph.json data/graph.json
          git config user.name "archmap-bot"
          git config user.email "archmap-bot@users.noreply.github.com"
          git add data/graph.json
          git diff --cached --quiet || (git commit -m "chore: update graph [$(date -u +%F)]" && git push)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
